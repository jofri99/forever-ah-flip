<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever AH - Horde</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --fg: #1a1d21; --muted: #6b7280;
    --border: #e2e5ea; --row: #fafbfc; --hover: #f0f2f5; --accent: #a8822f;
    --good: #1a7f37; --bad: #b42318; --grid: #eef0f3; --bar: #c9b68a;
    --gold: #8a6d1f; --silver: #5b6269; --copper: #9a5b32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --panel: #1b1f25; --fg: #e8eaed; --muted: #98a1ab;
      --border: #2a303a; --row: #1f242b; --hover: #262c35; --accent: #d9b877;
      --good: #4ade80; --bad: #f87171; --grid: #232830; --bar: #6f6247;
      --gold: #d9b877; --silver: #a8adb5; --copper: #c08457;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header, main, footer { max-width: 1400px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header { padding-top: 20px; padding-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding-bottom: 32px; }
  footer { color: var(--muted); font-size: 12px; padding-bottom: 40px; }
  footer a { color: inherit; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  #detail { padding: 16px; margin: 12px 0 18px; }
  .detail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-head .spacer { flex: 1; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  }
  .link { color: var(--muted); font-size: 13px; }
  .btn {
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    background: transparent; color: var(--fg); border: 1px solid var(--border);
  }
  .btn:hover { background: var(--hover); }

  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 128px; }
  .tile .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .n { color: var(--muted); font-size: 11px; }

  #chart { height: 400px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
  .legend i.dashed { border-top-style: dashed; border-top-width: 1px; }
  .legend i.block { height: 9px; border: 0; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  input[type="search"], select {
    background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 7px 10px; font-size: 14px;
  }
  input[type="search"] { min-width: 240px; flex: 1 1 240px; }
  .count { color: var(--muted); font-size: 13px; }

  .wrap { overflow: auto; max-height: 72vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 12px; text-align: left; white-space: nowrap; }
  th {
    position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .03em; z-index: 1;
  }
  th:hover { color: var(--fg); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .arrow { opacity: .6; font-size: 10px; }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row); }
  tbody tr:hover, tbody tr.selected { background: var(--hover); }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .g { color: var(--gold); } .s { color: var(--silver); } .c { color: var(--copper); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat, .none { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 10px 2px; }
  .err { color: var(--bad); margin: 16px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Forever AH &ndash; Horde, Ruleset Normal</h1>
  <div class="sub" id="status">Lade Daten &hellip;</div>
</header>

<main>
  <div class="err hidden" id="err"></div>

  <section id="detail" class="panel hidden" aria-live="polite">
    <div class="detail-head">
      <h2 id="d-title"></h2>
      <span class="badge" id="d-kind"></span>
      <a class="link" id="d-link" target="_blank" rel="noopener noreferrer">Wowhead</a>
      <span class="spacer"></span>
      <button class="btn" id="d-close">Schliessen</button>
    </div>
    <div class="tiles" id="d-tiles"></div>
    <div id="chart"></div>
    <div class="legend">
      <span><i style="border-color: var(--accent)"></i>g&uuml;nstigster Preis</span>
      <span><i class="dashed" style="border-color: var(--muted)"></i>Median</span>
      <span><i class="block" style="background: var(--bar)"></i><span id="d-bars">Angebote</span></span>
    </div>
    <div class="note" id="d-note"></div>
  </section>

  <section id="list" class="hidden">
    <div class="controls">
      <input type="search" id="q" placeholder="Item oder ID suchen ...">
      <select id="kind" aria-label="Art">
        <option value="all">Alle Arten</option>
        <option value="auction">Einzelst&uuml;cke</option>
        <option value="commodity">Stapelware</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="panel wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="note" id="footnote"></div>
  </section>
</main>

<footer>
  Daten: Battle.net-API von Blizzard, st&uuml;ndlich gesammelt. Preise je St&uuml;ck.
  Diagramme: <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView Lightweight Charts</a>.
</footer>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script type="module">
import {
  asyncBufferFromUrl, cachedAsyncBuffer, parquetMetadataAsync, parquetReadObjects,
} from "https://cdn.jsdelivr.net/npm/hyparquet@1.33.0/+esm";

const DATA = "data/";
const MAX_ROWS = 300;
const SERIES_COLUMNS = ["item_id", "kind", "ts", "min_price", "median_price", "n_listings", "qty_sold"];

const state = {
  meta: null,
  market: [],
  names: {},
  hourly: null,          // { file, metadata, groups }
  sort: { key: "n_listings", dir: -1 },
  selected: null,        // "2589:commodity"
  chart: null,
};

const $ = (id) => document.getElementById(id);

/* ---------- Formatierung ---------- */

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Kupfer als Gold/Silber/Kupfer, farbig, fuer die Tabelle.
function money(copper) {
  if (copper == null) return '<span class="none">&ndash;</span>';
  const c = Math.round(copper);
  const g = Math.floor(c / 10000), s = Math.floor((c % 10000) / 100), k = c % 100;
  const parts = [];
  if (g) parts.push(`<span class="g">${g.toLocaleString("de-DE")}g</span>`);
  if (g || s) parts.push(`<span class="s">${s}s</span>`);
  parts.push(`<span class="c">${k}k</span>`);
  return parts.join(" ");
}

// Dasselbe kurz und ohne Markup, fuer die Achse des Diagramms.
function moneyShort(copper) {
  const c = Math.round(copper);
  const f = (v) => v.toLocaleString("de-DE", { maximumFractionDigits: 2 });
  if (Math.abs(c) >= 10000) return f(c / 10000) + "g";
  if (Math.abs(c) >= 100) return f(c / 100) + "s";
  return c + "k";
}

const int = (n) => (n == null ? '<span class="none">&ndash;</span>' : Math.round(n).toLocaleString("de-DE"));

function change(pct) {
  if (pct == null) return '<span class="none">&ndash;</span>';
  const cls = pct > 0 ? "up" : pct < 0 ? "down" : "flat";
  const sign = pct > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${pct.toLocaleString("de-DE", { maximumFractionDigits: 1 })} %</span>`;
}

const keyOf = (row) => `${row.item_id}:${row.kind}`;
const nameOf = (row) => state.names[row.item_id] || `Item ${row.item_id}`;
const kindLabel = (kind) => (kind === "commodity" ? "Stapelware" : "Einzelstück");

function when(iso) {
  return new Date(iso).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
}

/* ---------- Tabelle ---------- */

const COLUMNS = [
  { key: "name", label: "Item", fmt: (r) => `${esc(nameOf(r))}${r.kind === "commodity" ? ' <span class="badge">Stapel</span>' : ""}` },
  { key: "min_price", label: "Günstigster", num: true, fmt: (r) => money(r.min_price) },
  { key: "median_price", label: "Median", num: true, fmt: (r) => money(r.median_price) },
  { key: "n_listings", label: "Angebote", num: true, fmt: (r) => int(r.n_listings) },
  { key: "quantity", label: "Menge", num: true, fmt: (r) => int(r.quantity) },
  { key: "change_24h_pct", label: "24 h", num: true, fmt: (r) => change(r.change_24h_pct) },
  { key: "qty_sold_24h", label: "Verkauft 24 h", num: true, fmt: (r) => int(r.qty_sold_24h) },
  { key: "value_sold_24h", label: "Umsatz 24 h", num: true, fmt: (r) => money(r.value_sold_24h) },
];

function visibleRows() {
  const q = $("q").value.trim().toLowerCase();
  const kind = $("kind").value;
  const { key, dir } = state.sort;

  const rows = state.market.filter((r) => {
    if (kind !== "all" && r.kind !== kind) return false;
    if (!q) return true;
    return String(r.item_id) === q || nameOf(r).toLowerCase().includes(q);
  });

  rows.sort((a, b) => {
    if (key === "name") return nameOf(a).localeCompare(nameOf(b), "de") * dir;
    const x = a[key], y = b[key];
    // Fehlende Werte immer ans Ende, egal in welche Richtung sortiert wird.
    if (x == null && y == null) return a.item_id - b.item_id;
    if (x == null) return 1;
    if (y == null) return -1;
    return (x - y) * dir || a.item_id - b.item_id;
  });
  return rows;
}

function renderTable() {
  const rows = visibleRows();
  const { key, dir } = state.sort;

  $("thead").innerHTML = "<tr>" + COLUMNS.map((c) => {
    const arrow = c.key === key ? ` <span class="arrow">${dir === 1 ? "▲" : "▼"}</span>` : "";
    return `<th data-key="${c.key}"${c.num ? ' class="num"' : ""}>${c.label}${arrow}</th>`;
  }).join("") + "</tr>";

  $("tbody").innerHTML = rows.slice(0, MAX_ROWS).map((r) => {
    const cells = COLUMNS.map((c) => `<td${c.num ? ' class="num"' : ""}>${c.fmt(r)}</td>`).join("");
    const selected = keyOf(r) === state.selected ? ' class="selected"' : "";
    return `<tr data-key="${keyOf(r)}"${selected}>${cells}</tr>`;
  }).join("");

  $("count").textContent = `${rows.length.toLocaleString("de-DE")} Items`;
  $("footnote").textContent = rows.length > MAX_ROWS
    ? `Zeigt die ersten ${MAX_ROWS} - weiter eingrenzen oder anders sortieren.`
    : "";
}

/* ---------- Verlauf eines Items ---------- */

// Oeffnet hourly.parquet einmal und merkt sich, welche Zeilengruppe welche Items enthaelt.
async function openHourly() {
  if (state.hourly) return state.hourly;
  const url = `${DATA}hourly.parquet?v=${encodeURIComponent(state.meta.built_at)}`;
  const file = cachedAsyncBuffer(await asyncBufferFromUrl({ url }));
  const metadata = await parquetMetadataAsync(file);

  let start = 0;
  const groups = metadata.row_groups.map((group) => {
    const rows = Number(group.num_rows);
    const stats = group.columns.find((c) => c.meta_data.path_in_schema[0] === "item_id").meta_data.statistics;
    const entry = { start, end: start + rows, min: stats.min_value, max: stats.max_value };
    start += rows;
    return entry;
  });

  state.hourly = { file, metadata, groups };
  return state.hourly;
}

// Die Datei ist nach Item sortiert. Gelesen werden nur die Gruppen, in deren
// Bereich die ID faellt - meist eine, an einer Gruppengrenze zwei.
async function loadSeries(itemId, kind) {
  const { file, metadata, groups } = await openHourly();
  const series = [];
  for (const group of groups) {
    if (itemId < group.min || itemId > group.max) continue;
    const rows = await parquetReadObjects({
      file, metadata, columns: SERIES_COLUMNS, rowStart: group.start, rowEnd: group.end,
    });
    for (const row of rows) {
      if (row.item_id === itemId && row.kind === kind) series.push(row);
    }
  }
  return series.sort((a, b) => a.ts - b.ts);
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function chartColors() {
  return {
    layout: {
      background: { type: "solid", color: cssVar("--panel") },
      textColor: cssVar("--muted"),
      fontFamily: getComputedStyle(document.body).fontFamily,
      panes: { separatorColor: cssVar("--border") },
    },
    grid: { vertLines: { color: cssVar("--grid") }, horzLines: { color: cssVar("--grid") } },
    rightPriceScale: { borderColor: cssVar("--border") },
    timeScale: { borderColor: cssVar("--border") },
  };
}

function ensureChart() {
  if (state.chart) return state.chart;
  const LC = window.LightweightCharts;
  const priceFormat = { type: "custom", minMove: 1, formatter: moneyShort };

  const chart = LC.createChart($("chart"), {
    autoSize: true,
    ...chartColors(),
    timeScale: { borderColor: cssVar("--border"), timeVisible: true, secondsVisible: false },
    localization: { locale: "de-DE" },
    crosshair: { mode: LC.CrosshairMode.Normal },
  });

  const min = chart.addSeries(LC.LineSeries, { color: cssVar("--accent"), lineWidth: 2, priceFormat });
  const median = chart.addSeries(LC.LineSeries, {
    color: cssVar("--muted"), lineWidth: 1, lineStyle: LC.LineStyle.Dashed, priceFormat,
  });
  const bars = chart.addSeries(LC.HistogramSeries, {
    color: cssVar("--bar"), priceFormat: { type: "volume" },
  }, 1);

  const panes = chart.panes();
  if (panes[1] && panes[1].setHeight) panes[1].setHeight(110);

  state.chart = { chart, min, median, bars };
  return state.chart;
}

// Die Bibliothek rechnet in UTC. Fuer die Anzeige in Ortszeit wird jeder
// Zeitpunkt um den Abstand zur UTC verschoben - der uebliche Weg laut Doku.
const localTime = (ts) => ts - new Date(ts * 1000).getTimezoneOffset() * 60;

function drawSeries(series) {
  const { chart, min, median, bars } = ensureChart();
  const few = series.length < 30;

  min.applyOptions({ pointMarkersVisible: few });
  min.setData(series.filter((r) => r.min_price != null).map((r) => ({ time: localTime(r.ts), value: r.min_price })));
  median.setData(series.filter((r) => r.median_price != null).map((r) => ({ time: localTime(r.ts), value: r.median_price })));

  // Verkaeufe gibt es erst, wenn zwei Staende verglichen wurden. Bis dahin zeigen
  // die Balken die Zahl der Angebote.
  const sold = series.filter((r) => r.qty_sold != null);
  if (sold.length) {
    bars.setData(sold.map((r) => ({ time: localTime(r.ts), value: r.qty_sold })));
    $("d-bars").textContent = "verkaufte Menge je Stand";
  } else {
    bars.setData(series.map((r) => ({ time: localTime(r.ts), value: r.n_listings })));
    $("d-bars").textContent = "Angebote";
  }
  chart.timeScale().fitContent();
  return sold.length;
}

function tile(label, value, note = "") {
  return `<div class="tile"><div class="k">${label}</div><div class="v">${value}</div>` +
    (note ? `<div class="n">${note}</div>` : "") + "</div>";
}

async function select(key, { scroll = true } = {}) {
  const row = state.market.find((r) => keyOf(r) === key);
  if (!row) return;

  state.selected = key;
  if (location.hash.slice(1) !== key) history.replaceState(null, "", "#" + key);
  renderTable();

  $("d-title").textContent = nameOf(row);
  $("d-kind").textContent = kindLabel(row.kind);
  $("d-link").href = `https://www.wowhead.com/classic/de/item=${row.item_id}`;

  const hours = row.sales_hours_24h;
  const coverage = row.qty_sold_24h == null
    ? "noch kein Vergleich"
    : hours < 23 ? `aus ${Math.round(hours)} von 24 h` : "";

  $("d-tiles").innerHTML = [
    tile("Günstigster", money(row.min_price)),
    tile("Median", money(row.median_price)),
    tile("Angebote", int(row.n_listings), `${int(row.quantity)} Stück`),
    tile("24 h Tief / Hoch", `${money(row.low_24h)} / ${money(row.high_24h)}`),
    tile("Veränderung 24 h", change(row.change_24h_pct)),
    tile("Verkauft 24 h", int(row.qty_sold_24h), coverage),
  ].join("");

  $("detail").classList.remove("hidden");
  $("d-note").textContent = "Lade Verlauf ...";
  if (scroll) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    const series = await loadSeries(row.item_id, row.kind);
    if (state.selected !== key) return;          // inzwischen ein anderes Item gewaehlt
    const withSales = drawSeries(series);
    const notes = [];
    if (series.length < 24) notes.push(`Erst ${series.length} Stände - der Verlauf füllt sich stündlich.`);
    if (!withSales) notes.push("Verkaufszahlen erscheinen, sobald zwei aufeinanderfolgende Stände verglichen wurden.");
    $("d-note").textContent = notes.join(" ");
  } catch (error) {
    $("d-note").textContent = "Verlauf konnte nicht geladen werden: " + error.message;
  }
}

function deselect() {
  state.selected = null;
  history.replaceState(null, "", location.pathname + location.search);
  $("detail").classList.add("hidden");
  renderTable();
}

/* ---------- Start ---------- */

async function getJson(path) {
  const response = await fetch(DATA + path, { cache: "no-cache" });
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

async function init() {
  try {
    state.meta = await getJson("meta.json");
    const version = encodeURIComponent(state.meta.built_at);
    const market = await fetch(`${DATA}market.parquet?v=${version}`);
    if (!market.ok) throw new Error(`market.parquet: HTTP ${market.status}`);
    state.market = await parquetReadObjects({ file: await market.arrayBuffer() });

    // Namen sind optional - ohne die Datei steht in der Tabelle "Item 12359".
    // meta.json sagt, ob es sie gibt; so entsteht keine vergebliche Anfrage.
    if (state.meta.names) {
      try { state.names = await getJson("names.json"); } catch { state.names = {}; }
    }

    const m = state.meta;
    $("status").textContent =
      `Stand ${when(m.last_snapshot)} · ${m.items.toLocaleString("de-DE")} Items · ` +
      `${m.snapshots} Stände seit ${when(m.first_snapshot)}`;
    $("list").classList.remove("hidden");
    renderTable();

    if (location.hash.length > 1) select(decodeURIComponent(location.hash.slice(1)), { scroll: false });
  } catch (error) {
    $("status").textContent = "Keine Daten.";
    $("err").textContent =
      `Die Daten konnten nicht geladen werden (${error.message}). ` +
      "Lokal zuerst `python -m collector publish` ausführen und die Seite über `python tools/serve.py` öffnen.";
    $("err").classList.remove("hidden");
  }
}

$("thead").addEventListener("click", (event) => {
  const th = event.target.closest("th");
  if (!th) return;
  const key = th.dataset.key;
  state.sort = state.sort.key === key
    ? { key, dir: -state.sort.dir }
    : { key, dir: key === "name" ? 1 : -1 };
  renderTable();
});

$("tbody").addEventListener("click", (event) => {
  const tr = event.target.closest("tr");
  if (tr) select(tr.dataset.key);
});

$("q").addEventListener("input", renderTable);
$("kind").addEventListener("change", renderTable);
$("d-close").addEventListener("click", deselect);

window.addEventListener("hashchange", () => {
  const key = decodeURIComponent(location.hash.slice(1));
  if (key && key !== state.selected) select(key);
});

// Wechselt das System zwischen hell und dunkel, zieht das Diagramm die Farben nach.
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!state.chart) return;
  const { chart, min, median, bars } = state.chart;
  chart.applyOptions(chartColors());
  min.applyOptions({ color: cssVar("--accent") });
  median.applyOptions({ color: cssVar("--muted") });
  bars.applyOptions({ color: cssVar("--bar") });
});

init();
</script>
</body>
</html>
