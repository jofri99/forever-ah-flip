name: collect

# Holt den Stand von Haus 114 und legt ihn im Branch `data` ab.
#
# Blizzard baut die Daten stuendlich gegen :19 neu. Drei Versuche je Stunde: der
# erste kurz danach, die anderen fangen Verspaetungen des Schedulers ab. Ein Lauf
# ohne neue Daten bekommt 304 zurueck, laedt nichts und schreibt nichts.
on:
  schedule:
    - cron: "2,22,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Sammler gleichzeitig - sie wuerden denselben Branch beschreiben.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Warehouse auschecken (Branch data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/warehouse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Die rohe Momentaufnahme des letzten Standes. Sie gehoert nicht in Git, weil
      # sie sich jedes Mal komplett aendert, muss aber von Lauf zu Lauf ueberleben -
      # sonst fehlt der Vergleich, aus dem die Verkaeufe entstehen. Ist der Cache
      # leer, gibt es fuer diesen einen Stand keine Verkaeufe, mehr nicht.
      - name: Vergleichsstand holen
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Sammeln
        id: collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          if [ -z "$BLIZZARD_CLIENT_ID" ] || [ -z "$BLIZZARD_CLIENT_SECRET" ]; then
            echo "::error::Die Secrets BLIZZARD_CLIENT_ID und BLIZZARD_CLIENT_SECRET fehlen. Anlegen unter Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python -m collector collect

      - name: Stand in den Branch data schreiben
        if: steps.collect.outputs.new == 'true'
        working-directory: data/warehouse
        env:
          SUMMARY: ${{ steps.collect.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$SUMMARY"
          git push -q

      - name: Vergleichsstand fuer den naechsten Lauf sichern
        if: steps.collect.outputs.new == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: state-${{ github.run_id }}
